<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Recent Kiln Drop-Offs</title>
<style>
  /* Design tokens: the only place a colour, font stack, length or number is written.
     Every rule below uses them through var(); the tests enforce it (README, "Look and
     brand tokens"). The response's Content-Security-Policy allows this block by its
     SHA-256 hash, so any edit here changes the hash; lambda_function.py recomputes it. */
  :root {
    color-scheme: light;

    /* Brand colours (Asmbly brand guide). */
    --asmbly-purple: #292D6A;
    --asmbly-white: #F2F4EF;
    --midnight-black: #171d1a;
    --ceramics: #b34a9a;
    --lasers: #D33E43;

    /* Derived, per sRGB channel, rounded:
       tint(p) = p × colour + (1 − p) × asmbly-white;
       shade(p) = p × colour + (1 − p) × midnight-black. A test recomputes each. */
    --ceramics-shade: #944180;
    --ceramics-shade-60: #753867;
    --ceramics-40: #d9b0cd;
    --ceramics-20: #e5d2de;
    --ceramics-10: #ece3e6;
    --lasers-shade: #ad373b;
    --lasers-20: #ecd0cd;

    /* What each colour is for. */
    --page-bg: var(--asmbly-white);
    --text: var(--midnight-black);
    --accent: var(--ceramics);
    --on-accent: var(--asmbly-white);
    --accent-strong: var(--ceramics-shade);
    --accent-hover: var(--ceramics-shade-60);
    --table-head-bg: var(--ceramics-20);
    --row-hover-bg: var(--ceramics-10);
    --line: var(--ceramics-40);
    --focus: var(--ceramics-shade-60);
    --logo-colour: var(--asmbly-purple);
    --error-bg: var(--lasers-20);
    --error-edge: var(--lasers-shade);

    /* The error heading's glyph. After the slash is its alternative text, empty so
       screen readers skip it. A browser without that syntax shows no glyph; the edge
       and the heading still mark the error. */
    --glyph-error: "✕" / "";

    /* Type: system stacks, no font file is fetched. */
    --font-body: Roboto, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-heading: "Helvetica Neue", "Segoe UI", Roboto, Arial, system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-size-body: 1rem;
    --font-size-h1: 1.75rem;
    --font-size-h2: 1.25rem;
    --font-size-id: 1.125rem;
    --font-size-small: 0.875rem;
    --line-height: 1.5;
    --line-height-heading: 1.2;
    --weight-heading: 700;
    --weight-strong: 600;

    /* Space and size. */
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.5rem;
    --space-6: 2rem;
    --gutter: var(--space-4);
    --radius: var(--space-2);
    --content-max-width: 50rem;
    --icon-height: 3rem;
    --logo-height: 3.5rem;
    --border-width: 1px;
    --border-width-accent: 4px;
    --focus-width: 3px;
    --focus-offset: 2px;
    --tap-target: 2.75rem;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); color: var(--text); font-family: var(--font-body); font-size: var(--font-size-body); line-height: var(--line-height); }
  h1, h2 { font-family: var(--font-heading); font-weight: var(--weight-heading); line-height: var(--line-height-heading); }

  /* The band holds only the icon and the title: Asmbly White on the ceramics colour is
     4.35:1, enough for large text and the icon, not for body text. */
  .brand-band { background: var(--accent); color: var(--on-accent); }
  .brand-inner {
    max-width: var(--content-max-width); margin: 0 auto; padding: var(--space-4) var(--gutter);
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4);
  }
  .ceramics-icon { display: block; flex: none; height: var(--icon-height); width: auto; fill: currentColor; }
  .brand-band h1 { margin: 0; font-size: var(--font-size-h1); color: var(--on-accent); }

  .container { max-width: var(--content-max-width); margin: 0 auto; padding: var(--space-5) var(--gutter); }
  .subtitle { margin: 0 0 var(--space-4); text-align: center; color: var(--text); }
  .instructions { margin: 0 0 var(--space-5); text-align: center; font-size: var(--font-size-h2); font-weight: var(--weight-strong); color: var(--text); }

  /* The list, three columns even on a 320px phone. A long name wraps anywhere inside its
     cell, never widening the page. The ID never splits (members copy it onto a slip). The
     headers wrap only between words, so "Submitted" keeps the time column wide enough for
     a date in the small size; the time wraps only at its space. */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: var(--space-3) var(--space-1); text-align: left; vertical-align: top; border-bottom: var(--border-width) solid var(--line); }
  td { overflow-wrap: anywhere; }
  th { background: var(--table-head-bg); color: var(--text); font-family: var(--font-heading); font-weight: var(--weight-heading); }
  td:nth-child(3) { font-size: var(--font-size-small); overflow-wrap: normal; }
  .task-id { font-family: var(--font-mono); font-size: var(--font-size-id); font-weight: var(--weight-heading); color: var(--accent-strong); white-space: nowrap; }
  .no-tasks { padding: var(--space-5) var(--space-2); text-align: center; color: var(--text); }

  /* The error. It differs from the page by its edge and glyph, not only by colour. */
  .error-box { padding: var(--space-4); background: var(--error-bg); color: var(--text); border-left: var(--border-width-accent) solid var(--error-edge); border-radius: var(--radius); }
  .error-box h2 { margin: 0 0 var(--space-2); font-size: var(--font-size-h2); color: var(--text); }
  .error-box h2::before { content: var(--glyph-error); margin-right: var(--space-2); color: var(--error-edge); }
  .error-box p { margin: 0; }

  .reload-section { margin-top: var(--space-6); text-align: center; }
  .reload-text { margin: 0 0 var(--space-4); color: var(--text); }
  .reload-button {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: var(--tap-target); min-width: var(--tap-target); padding: var(--space-3) var(--space-6);
    border-radius: var(--radius); background: var(--accent-strong); color: var(--on-accent);
    font-family: var(--font-heading); font-weight: var(--weight-heading); text-decoration: none;
  }
  .reload-button:focus-visible { outline: var(--focus-width) solid var(--focus); outline-offset: var(--focus-offset); }

  .site-footer { padding: var(--space-6) var(--gutter); text-align: center; }
  .logo { display: inline-block; height: var(--logo-height); width: auto; max-width: 100%; fill: currentColor; color: var(--logo-colour); }

  /* Hover, only where a pointer can hover (a tap on a phone would leave it on). */
  @media (hover: hover) {
    tbody tr:hover { background: var(--row-hover-bg); }
    .reload-button:hover { background: var(--accent-hover); }
  }
</style>
</head>
