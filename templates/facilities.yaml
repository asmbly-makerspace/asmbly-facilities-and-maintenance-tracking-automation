AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31
Description: Resources for Facilities-focused Lambda functions.

Parameters:
  Stage:
    Type: String
    Description: The deployment stage (e.g., dev, stage, prod).
  RequestsLayerARN:
    Type: String
    Description: The ARN of the shared Requests Lambda Layer.
  CommonLayerARN:
    Type: String
    Description: The ARN of the shared Common Utilities Lambda Layer.

  ClickUpWorkspaceFieldIdParameterName: { Type: String }
  RouterConfigParameterName:
    Type: String
    Description: The name of the Slack event router's SSM parameter, which lists the PM channels (pm_channels).

Conditions:
  IsProd: !Equals [!Ref Stage, 'prod']

Resources:
  # --- Facilities: PM Reminder Bot ---
  ClickUpPMScheduleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${Stage}/clickup/cmms/pmSchedule"
      Type: String
      Description: "JSON configuration for the PM reminder bot: the ClickUp PM Schedule list ID, the status that marks a task done, and the workspace-to-Slack-channel map."
      Value:
        Fn::ToJsonString:
          Fn::Transform:
            Name: 'AWS::Include'
            Parameters:
              Location: ../configs/clickup_cmms_pmSchedule.json
      Tags:
        Project: facilities:pm-reminder-bot

  PMReminderBotLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: PMReminderBotPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt PMReminderBotLogGroup.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:clickup/api/token-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:slack-maintenancebot-token-*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ClickUpWorkspaceFieldIdParameterName}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Stage}/clickup/cmms/pmSchedule'

      Tags:
        - Key: Project
          Value: facilities:pm-reminder-bot

  PMReminderBotLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/asmbly/lambda/PMReminderBotFunction-${Stage}"
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: facilities:pm-reminder-bot

  PMReminderBotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "PMReminderBotFunction-${Stage}"
      Description: "Scheduled function that fetches overdue and upcoming preventative maintenance tasks from ClickUp and sends reminder notifications to the appropriate Slack channels."
      CodeUri: ../functions/facilities/pm_bot_reminder/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 180
      Role: !GetAtt PMReminderBotLambdaRole.Arn
      LoggingConfig:
        LogGroup: !Ref PMReminderBotLogGroup
      Layers:
        - !Ref RequestsLayerARN
        - !Ref CommonLayerARN
      Environment:
        Variables:
          DRY_RUN: !If [IsProd, 'false', 'true']
          BOT_ICON_EMOJI: ':hammer_and_wrench:'
          BOT_NAME: 'PM Bot'
          CLICKUP_SECRET_NAME: 'clickup/api/token'
          GENERAL_CHANNEL_NAME: 'stewards'
          SLACK_MAINTENANCE_BOT_SECRET_NAME: !Sub 'slack-maintenancebot-token'
          WORKSPACES: '3d-printing,ceramics,electronics,lasers,metal-shop,textiles,woodshop'
          CLICKUP_ASSET_FIELD_ID: '487e2b73-8329-4ce2-a0a1-1b83a6069ed1'
          CLICKUP_FREQUENCY_FIELD_ID: 'b0d864da-9018-4935-ae65-7a9103bf70d2'
          CLICKUP_PM_SCHEDULE_CONFIG_PARAM_NAME: !Ref ClickUpPMScheduleParameter
          CLICKUP_WORKSPACE_FIELD_ID_PARAM_NAME: !Ref ClickUpWorkspaceFieldIdParameterName
          STARTER_MESSAGE_TEXT: |
            Weekly task update!
            * Mark tasks with :loading: to show that they're being worked on!
            * Mark tasks with :white_check_mark: to call them done!
      Tags:
        Project: facilities:pm-reminder-bot

  # Explicit EventBridge Rule and Permission (replaces the 'Events' block)
  PMReminderBotScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "pm-reminder-bot-schedule-${Stage}" # A short, valid name
      Description: "Triggers the lambda task fetcher every Saturday morning"
      ScheduleExpression: "cron(30 4 ? * SAT *)"
      State: "ENABLED"
      Targets:
        - Arn: !GetAtt PMReminderBotFunction.Arn
          Id: "PMReminderBotFunctionTarget"

  PMReminderBotSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PMReminderBotFunction.Arn
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt PMReminderBotScheduleRule.Arn

  # --- Facilities: PM reminder checkmark reactions ---
  # One item per PM task: whether a completion from Slack is in flight or done, and for
  # which reminder. It makes duplicate and stale check marks harmless. Phase 5 adds
  # short-lived reply markers, which expire through the TTL.
  PMReminderCompletionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "PMReminderCompletions-${Stage}"
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: facilities:pm-reminder-reaction

  PMReminderReactionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/asmbly/lambda/PMReminderReactionFunction-${Stage}"
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: facilities:pm-reminder-reaction

  PMReminderReactionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: PMReminderReactionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt PMReminderReactionLogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:clickup/api/token-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:slack-maintenancebot-token-*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${RouterConfigParameterName}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Stage}/clickup/cmms/pmSchedule'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt PMReminderCompletionsTable.Arn
      Tags:
        - Key: Project
          Value: facilities:pm-reminder-reaction

  PMReminderReactionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "PMReminderReactionFunction-${Stage}"
      Description: "Completes a PM Schedule task in ClickUp when someone adds a white check mark to its PM Bot reminder in Slack (invoked by the Slack event router)."
      CodeUri: ../functions/facilities/pm_reminder_reaction/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      # auth.test, conversations.history, Get Task, Update Task, a re-read after a failed
      # update, a 2-second wait and re-read to see whether the task recurred, and the
      # thread reply, each with an 8-second connect and read timeout, plus SSM, Secrets
      # Manager and DynamoDB; later phases add calls. The worst case of every timeout adds
      # up to more than this; a run cut off leaves a pending claim the code resolves.
      # CLAIM_EXPIRY_SECONDS in the code must stay at least three times this (a test checks it).
      Timeout: 90
      Role: !GetAtt PMReminderReactionLambdaRole.Arn
      LoggingConfig:
        LogGroup: !Ref PMReminderReactionLogGroup
      Layers:
        - !Ref RequestsLayerARN
        - !Ref CommonLayerARN
      Environment:
        Variables:
          DRY_RUN: !If [IsProd, 'false', 'true']
          BOT_NAME: 'PM Bot'
          BOT_ICON_EMOJI: ':hammer_and_wrench:'
          CLICKUP_SECRET_NAME: 'clickup/api/token'
          SLACK_MAINTENANCE_BOT_SECRET_NAME: 'slack-maintenancebot-token'
          CLICKUP_PM_SCHEDULE_CONFIG_PARAM_NAME: !Ref ClickUpPMScheduleParameter
          ROUTER_CONFIG_PARAMETER_NAME: !Ref RouterConfigParameterName
          PM_COMPLETIONS_TABLE_NAME: !Ref PMReminderCompletionsTable
      Tags:
        Project: facilities:pm-reminder-reaction

Outputs:
  PMReminderBotFunctionArn:
    Description: "The ARN of the PM Reminder Bot Lambda Function"
    Value: !GetAtt PMReminderBotFunction.Arn
  PMReminderReactionFunctionArn:
    Description: "The ARN of the PM Reminder Reaction Lambda Function"
    Value: !GetAtt PMReminderReactionFunction.Arn
